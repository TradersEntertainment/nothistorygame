# Sürüm yayınlama: main dalında VERSION dosyası değişince ya da "v*" etiketi gönderilince oyunu test eder, Windows, Linux ve macOS için
# dışa aktarır, Windows kurulum programını (NSIS) üretir ve GitHub Releases'e yükler.
# Elle çalıştırıldığında (workflow_dispatch) "version" verilirse etiketi ve sürümü GitHub
# kendisi oluşturur (örn. version=0.1.0 -> v0.1.0); boş bırakılırsa dosyalar sadece
# "artifact" olarak saklanır.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["VERSION", ".github/release-mirrors.txt"]
  workflow_dispatch:
    inputs:
      version:
        description: "Yayınlanacak sürüm (örn. 0.1.0). Boş: sadece derle."
        required: false
        default: ""
      full_tests:
        description: "Tam test paketi (~80 dk). Kapalı: hızlı test (~15 dk)."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Aynı commit iki kez tetiklenirse (etiket + main, ya da bekçinin yeniden denemesi) koşular sıraya girer, yarışmaz.
# Grup commit başına: art arda gelen sürümler birbirini bekletmez, sıradaki koşu iptal edilmez.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"
  # Açık indirme deposu için token tanımlıysa "true" (secret'lar if içinde doğrudan kullanılamaz)
  HAS_PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Godot, dışa aktarım şablonları ve NSIS
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q --tries=3 --waitretry=10 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q --tries=3 --waitretry=10 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -qj "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/macos.zip templates/version.txt -d "$T"
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip

      # Push ile yayında hızlı test (her bölüm bir kez); tam paket yerelde her sürümden önce koşulur,
      # burada da elle çalıştırmada "full_tests" ile seçilebilir.
      - name: Testler
        env:
          QUICK: ${{ inputs.full_tests == true && '0' || '1' }}
        run: GODOT=./godot tests/run_tests.sh

      - name: Dışa aktar ve paketle
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}";
          elif [ -n "${{ inputs.version }}" ]; then VERSION="${{ inputs.version }}";
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then VERSION="$(tr -d ' \n' < VERSION)";
          else VERSION="0.0.0"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ -n "${{ inputs.version }}" ]; then echo "PUBLISH=1" >> "$GITHUB_ENV"; fi
          # Dışa aktarım ayarlarındaki sürüm (Windows dosya özellikleri, macOS Info.plist) VERSION'la aynı olsun (0.1.0.0 kalmıştı)
          sed -i -E "s/^application\/(file_version|product_version)=.*/application\/\1=\"$VERSION.0\"/; s/^application\/(short_version|version)=.*/application\/\1=\"$VERSION\"/" export_presets.cfg
          grep -E "^application/(file_version|product_version|short_version|version)=" export_presets.cfg
          mkdir -p build/windows build/linux dist
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/GercekTarihBuDegil.exe
          ./godot --headless --path . --export-release "Linux" build/linux/GercekTarihBuDegil.x86_64
          test -s build/windows/GercekTarihBuDegil.exe
          test -s build/linux/GercekTarihBuDegil.x86_64
          # Paketli oyun gerçekten açılıyor mu (oyuncunun indirdiği dosya; testler projeyi klasörden çalıştırır).
          # 0.99.70-0.99.80: game_state.gd paketlenmeyen tests/'teki sınıfa bağlıydı, indirilen oyun açılmıyordu.
          # Windows paketi aynı oyun dosyalarını taşır.
          ./build/linux/GercekTarihBuDegil.x86_64 --headless --quit-after 300 > pkg_boot.log 2>&1 || true
          ./build/linux/GercekTarihBuDegil.x86_64 --headless -- --chapter=1 --autotest > pkg_ch1.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Failed to instantiate" pkg_boot.log pkg_ch1.log; then
            echo "::error::Paketli oyun açılmıyor (yukarıdaki hatalar)"; exit 1; fi
          grep -q "AUTOTEST PASS" pkg_ch1.log || { tail -20 pkg_ch1.log; echo "::error::Paketli oyunda 1. bölüm bitmedi"; exit 1; }
          echo "PAKET PASS: açılış hatasız, 1. bölüm tamam"
          (cd installer && makensis -V2 -DVERSION="$VERSION" -DSRC=../build/windows \
            -DOUT="../dist/GercekTarihBuDegil-Setup-$VERSION.exe" installer.nsi)
          cp installer/OYNA.txt build/windows/
          cp installer/OYNA.txt build/linux/
          (cd build/windows && zip -q -9 "../../dist/GercekTarihBuDegil-Windows-$VERSION.zip" *)
          (cd build/linux && zip -q -9 "../../dist/GercekTarihBuDegil-Linux-$VERSION.zip" *)
          ls -la dist

      - name: macOS (universal, ad-hoc imzalı; başarısız olursa diğer sürümler yine yayınlanır)
        continue-on-error: true
        run: |
          mkdir -p build/macos
          ./godot --headless --path . --export-release "macOS" build/macos/GercekTarihBuDegil.zip
          test -s build/macos/GercekTarihBuDegil.zip
          cp build/macos/GercekTarihBuDegil.zip "dist/GercekTarihBuDegil-macOS-$VERSION.zip"

      - name: macOS paketi çıktı mı
        run: |
          ls dist/GercekTarihBuDegil-macOS-*.zip >/dev/null 2>&1 || echo "::warning::macOS paketi üretilemedi; bu sürüm macOS'suz yayınlanıyor"

      - name: GitHub Releases'e yükle
        if: env.PUBLISH == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: "Gerçek Tarih Bu Değil v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            ## Gerçek Tarih Bu Değil — v${{ env.VERSION }}

            **Windows:** `GercekTarihBuDegil-Setup-${{ env.VERSION }}.exe` dosyasını indir ve çalıştır. Yönetici izni gerekmez, masaüstüne kısayol ekler.
            Kurulum istemiyorsan `GercekTarihBuDegil-Windows-${{ env.VERSION }}.zip` dosyasını aç ve `GercekTarihBuDegil.exe`'ye çift tıkla.

            Windows "kişisel bilgisayarınızı korudu" uyarısı verirse: **Ek bilgi → Yine de çalıştır** (oyun imzasız olduğu için normaldir).

            **Linux / Steam Deck:** `GercekTarihBuDegil-Linux-${{ env.VERSION }}.zip`

            **macOS:** `GercekTarihBuDegil-macOS-${{ env.VERSION }}.zip` (Intel ve Apple Silicon). İmzasız: ilk açılışta uygulamaya sağ tık → **Aç**.

            *Bu oyun gerçek tarih değildir. ...ama biraz öyle.*

      - name: Herkese açık indirme deposuna da yükle (TradersEntertainment/nothistorygamedemo)
        # Kaynak depo gizli; oyun dosyaları yalnızca bu açık depoda yayımlanır.
        # Gerekli secret: PUBLIC_RELEASE_TOKEN (yalnız nothistorygamedemo'ya "Contents: Read and write" izni olan token)
        if: env.PUBLISH == '1' && env.HAS_PUBLIC_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: TradersEntertainment/nothistorygamedemo
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: "Gerçek Tarih Bu Değil v${{ env.VERSION }}"
          make_latest: true
          files: dist/*
          body: |
            ## Gerçek Tarih Bu Değil — v${{ env.VERSION }}

            **Windows:** `GercekTarihBuDegil-Setup-${{ env.VERSION }}.exe` dosyasını indir ve çalıştır. Yönetici izni gerekmez, masaüstüne kısayol ekler.
            Kurulum istemiyorsan `GercekTarihBuDegil-Windows-${{ env.VERSION }}.zip` dosyasını aç ve `GercekTarihBuDegil.exe`'ye çift tıkla.

            Windows "kişisel bilgisayarınızı korudu" uyarısı verirse: **Ek bilgi → Yine de çalıştır** (oyun imzasız olduğu için normaldir).

            **Linux / Steam Deck:** `GercekTarihBuDegil-Linux-${{ env.VERSION }}.zip`

            **macOS:** `GercekTarihBuDegil-macOS-${{ env.VERSION }}.zip` (Intel ve Apple Silicon). İmzasız: ilk açılışta uygulamaya sağ tık → **Aç**.

            *Bu oyun gerçek tarih değildir. ...ama biraz öyle.*

      - name: Paylaşılmış eski sürüm sayfalarını güncelle (.github/release-mirrors.txt)
        if: env.PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -v '^#' .github/release-mirrors.txt | tr -d ' \r' | while read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "v$VERSION" ] && continue
            gh release view "$tag" >/dev/null 2>&1 || { echo "$tag yok, atlandı"; continue; }
            for a in $(gh release view "$tag" --json assets -q '.assets[].name'); do
              gh release delete-asset "$tag" "$a" -y
            done
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "Gerçek Tarih Bu Değil (güncel sürüm: v$VERSION)" --notes "## Bu sayfa en yeni sürümle güncellendi: v$VERSION

          **Windows:** \`GercekTarihBuDegil-Setup-$VERSION.exe\` dosyasını indir ve çalıştır. Önceki sürüm kuruluysa üstüne kurabilirsin.
          Kurulum istemiyorsan \`GercekTarihBuDegil-Windows-$VERSION.zip\` dosyasını aç ve \`GercekTarihBuDegil.exe\`'ye çift tıkla.

          Windows \"kişisel bilgisayarınızı korudu\" uyarısı verirse: **Ek bilgi → Yine de çalıştır**.

          **Linux:** \`GercekTarihBuDegil-Linux-$VERSION.zip\`

          Her zaman en yeni sürüm: https://github.com/${{ github.repository }}/releases/latest"
            echo "$tag -> v$VERSION dosyalarıyla güncellendi"
          done

      - name: Artifact (elle çalıştırma)
        if: env.PUBLISH != '1'
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/*
